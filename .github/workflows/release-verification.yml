name: SDK release verification

on:
  workflow_dispatch:
  pull_request:
    branches: ['release/**']
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-java21:
    uses: ./.github/workflows/mavenBuild.yml
    with:
      submodules: recursive
      javaVersions: |
        11
        17
        21
      mvnToolchainIds: |
        JavaSE-11
        JavaSE-17
        JavaSE-21
      maven-goals: clean verify -DskipTests=false -Dmaven.test.failure.ignore=false -DfailOnJavadocErrors=true -Dtycho.baseline.replace=none
      verify-test-reports: true
      rebuild-swt-native: true
