# SPDX-License-Identifier: EPL-2.0
name: Fork source closure (not product release)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test source gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_fork_source_preflight.py' -v
      - name: Check exact committed fork source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          python3 scripts/fork_source_preflight.py --root . | tee target/fork-source-closure.json
      - name: Archive source-only report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-source-closure-${{ github.sha }}-${{ github.run_attempt }}
          path: target/fork-source-closure.json
          if-no-files-found: warn
          retention-days: 90
