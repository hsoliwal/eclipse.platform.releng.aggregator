# SPDX-License-Identifier: Apache-2.0
# Native acceptance only. No passing source/reports, no release approval.
name: E4 and JFace combined source-pinned native SDK acceptance

on:
  pull_request:
    branches:
      - candidate/e4-jface-native-receipt-gate-20261123
    paths:
      - '.github/workflows/m3-e4-jface-combined-native.yml'
      - 'eclipse.platform.ui'
      - 'eclipse.platform.swt'
  push:
    branches:
      - candidate/e4-jface-combined-sdk-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-pins:
    name: Verify exact two-submodule native source pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: 'false'
          persist-credentials: false
      - name: Fail closed on an unexpected Gitlink or source ref
        shell: bash
        env:
          PIN_UI: e0c9cc54363f23d29a0811acb091c28eafa7d5c3
          PIN_SWT: 51a70dad3ea1d4ede76ab74e79b42926b82b4857
        run: |
          set -euo pipefail
          assert_gitlink() {
            local path="$1" expected="$2"
            local actual
            actual="$(git ls-tree HEAD -- "$path")"
            if [[ "$actual" != "160000 commit $expected"$'\t'"$path" ]]; then
              printf 'Refusing unsealed SDK gitlink %s: %s\n' "$path" "$actual" >&2
              exit 1
            fi
          }
          assert_gitlink eclipse.platform.ui "$PIN_UI"
          assert_gitlink eclipse.platform.swt "$PIN_SWT"
          printf 'Pinned source: %s\n' "$(git rev-parse HEAD)"
          printf 'Platform UI integrated: %s\n' "$PIN_UI"
          printf 'SWT candidate: %s\n' "$PIN_SWT"

  native-sdk:
    name: Native SWT / E4 / JFace Tycho acceptance
    needs: verify-source-pins
    permissions:
      contents: read
    uses: ./.github/workflows/mavenBuild.yml
    with:
      submodules: recursive
      verify-test-reports: true
      rebuild-swt-native: true
      require-e4-jface: true
      javaVersions: |
        11
        17
        25
        21
      mvnToolchainIds: |
        JavaSE-11
        JavaSE-17
        JavaSE-25
        JavaSE-21
