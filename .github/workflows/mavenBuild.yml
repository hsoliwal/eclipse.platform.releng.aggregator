name: Maven Build
on:
  workflow_call:
    inputs:
      maven-goals:
        description: maven goals to use, defaults to 'clean verify'
        required: false
        default: 'clean verify'
        type: string
      submodules:
        description: |
          Whether to checkout submodules: `true` to checkout submodules or `recursive` to recursively checkout submodules.
          When the `ssh-key` input is not provided, SSH URLs beginning with `git@github.com:` are converted to HTTPS.
          The value is just passed as it is to the github/actions/checkout action: https://github.com/actions/checkout#usage
        type: string
        required: false
        default: 'false'
      mavenVersion:
        description: 'The version of Maven set up'
        type: string
        required: false
        default: '3.9.16'
      javaVersions:
        description: JDK toolchains to install; the last entry runs Maven
        type: string
        required: false
        default: |
          11
          17
          21
          25
      mvnToolchainIds:
        description: Toolchain IDs in the same order as javaVersions
        type: string
        required: false
        default: |
          JavaSE-11
          JavaSE-17
          JavaSE-21
          JavaSE-25
      verify-test-reports:
        description: Require the SDK SWT, JFace and Workbench test reports
        type: boolean
        required: false
        default: false
      require-e4-jface:
        description: Require exact E4 UIJob and JFace native test reports
        type: boolean
        required: false
        default: false
      rebuild-swt-native:
        description: Build this runner's SWT JNI from the checked-out source
        type: boolean
        required: false
        default: false

permissions: {}

env:
  MAVEN_ARGS: >-
    --batch-mode --no-transfer-progress

jobs:
  event_file:
    name: "Upload Event File"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: event-file
        path: ${{ github.event_path }}
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: 
          - { name: Linux,   os: ubuntu-latest  }
          - { name: Windows, os: windows-latest }
          - { name: MacOS,   os: macos-latest   }
    defaults:
      run: # Run on bash/cmd, because powershell (the Windows default) interprets dots in arguments differently
        shell: ${{ matrix.config.name == 'Windows' && 'cmd' || 'bash' }}

    name: Verify ${{ matrix.config.name }}
    steps:
    - name: Enable long paths on Windows
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
       fetch-depth: 0 # required for jgit timestamp provider to work
       submodules: ${{ inputs.submodules }}
       persist-credentials: false
    - name: Set up Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{ inputs.javaVersions }}
        mvn-toolchain-id: ${{ inputs.mvnToolchainIds }}
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven
      uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
      with:
        maven-version: ${{ inputs.mavenVersion }}

    - name: Set up test-report validation
      if: inputs.verify-test-reports
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - name: Check test-report validation
      if: inputs.verify-test-reports
      shell: bash
      run: python scripts/testing/test_verify_test_reports.py
    - name: Record the SDK source and toolchains
      if: inputs.verify-test-reports
      shell: bash
      run: |
        {
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git submodule status --recursive
          java -version 2>&1
          mvn -version
        } > "$RUNNER_TEMP/sdk-source-$RUNNER_OS.txt"

    - name: Install GTK3 native build dependencies
      if: inputs.rebuild-swt-native && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y build-essential libgtk-3-dev freeglut3-dev libwebkit2gtk-4.1-0 dbus-daemon xvfb
    - name: Fetch the Windows WebView loader used by the native build
      if: inputs.rebuild-swt-native && runner.os == 'Windows'
      shell: bash
      run: git -C eclipse.platform.swt lfs pull --include='/binaries/org.eclipse.swt.win32.win32.x86_64/WebView2Loader.dll'

    - name: Refuse incomplete E4/JFace native proof configuration
      if: ${{ inputs.require-e4-jface && (!inputs.verify-test-reports || !inputs.rebuild-swt-native) }}
      shell: bash
      run: |
        echo 'E4/JFace native reports require executed SDK tests and a platform SWT native rebuild' >&2
        exit 1
    - name: Build with Maven
      env:
        GTK_VERSION: ${{ inputs.rebuild-swt-native && '3.0' || '' }}
        GTK_XCFLAGS: ${{ inputs.rebuild-swt-native && '-Wno-deprecated-declarations' || '' }}
        SWT_GTK4: ${{ inputs.rebuild-swt-native && '0' || '' }}
        GDK_BACKEND: ${{ inputs.rebuild-swt-native && 'x11' || '' }}
      run: >-
        ${{ runner.os == 'Linux' && 'xvfb-run' || '' }}
        mvn --show-version --update-snapshots --errors
        ${{ runner.os == 'Linux' && '-Dcompare-version-with-baselines.skip=false' || '' }}
        -Pbree-libs
        ${{ runner.os == 'Linux' && '-Papi-check' || '' }}
        ${{ inputs.rebuild-swt-native && format('-Dnative={0}', runner.os == 'Linux' && 'gtk.linux.x86_64' || runner.os == 'Windows' && 'win32.win32.x86_64' || runner.arch == 'ARM64' && 'cocoa.macosx.aarch64' || 'cocoa.macosx.x86_64') || '' }}
        --fail-at-end
        ${{ inputs.maven-goals }}
    - name: Require executed SDK tests
      if: inputs.verify-test-reports
      shell: bash
      run: |
        if [[ '${{ inputs.require-e4-jface }}' == 'true' ]]; then
          python scripts/testing/verify_test_reports.py --require-e4-jface
        else
          python scripts/testing/verify_test_reports.py
        fi
    - name: Upload Test Results for ${{ matrix.config.name }}
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ matrix.config.os }}
        if-no-files-found: ${{ inputs.verify-test-reports && 'error' || 'warn' }}
        path: |
          ${{ github.workspace }}/**/target/surefire-reports/*.xml
          ${{ github.workspace }}/**/target/screenshots/*.png
          ${{ runner.temp }}/sdk-source-${{ runner.os }}.txt
