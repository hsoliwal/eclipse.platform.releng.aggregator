# Maven/Tycho pom model adjustments, see https://github.com/eclipse-tycho/tycho/wiki/Tycho-Pomless
pom.model.property.repository.name = Equinox and Eclipse p2 ${releaseVersion}
pom.model.property.repository.includeAllDependencies = false
pom.model.property.repository.includeAllSources = true
pom.model.property.eclipse.signing.skip = false
# M3JDK21: this site only assembles p2 content; without the SWT fork's native-fragment capability requirement
# (org.eclipse.equinox.p2.installer -> org.eclipse.swt) it resolves for all 8 environments, see eclipse-platform-parent
pom.model.property.swt.capability.buildtime.disabled = true
